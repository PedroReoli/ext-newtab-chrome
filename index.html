<!DOCTYPE html>
<html lang="pt-BR" data-theme="zinc">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Guia Pro</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-glow"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <main class="app-container">
    <!-- Balanced 3-Column Header Layout -->
    <header class="header-bar">
      <!-- Left: Clock, Date & Greeting -->
      <div class="header-left">
        <div id="clock" class="clock">00:00</div>
        <div class="date-greeting">
          <span id="date">Carregando...</span>
          <span>•</span>
          <span id="greeting" class="greeting-text">Boa noite</span>
        </div>
      </div>

      <!-- Center: Top Navigation Bar -->
      <div class="header-center">
        <nav class="top-navbar">
          <div class="nav-tabs">
            <button class="nav-tab active" data-target="shortcuts-view">
              <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              </svg>
              Atalhos
            </button>

            <button class="nav-tab" data-target="bookmarks-view">
              <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
              Favoritos
            </button>

            <button class="nav-tab" data-target="automations-view">
              <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              Automações
            </button>
          </div>

          <div class="nav-actions">
            <button id="open-settings-btn" class="icon-btn" title="Configurações">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
          </div>
        </nav>
      </div>

      <!-- Right: Google Logo -->
      <div class="header-right">
        <div class="google-logo">
          <span class="logo-blue">G</span><span class="logo-red">o</span><span class="logo-yellow">o</span><span class="logo-blue">g</span><span class="logo-green">l</span><span class="logo-red">e</span>
        </div>
      </div>
    </header>

    <!-- Clean Search Section -->
    <section class="search-section">
      <form id="search-form" class="search-box" action="https://www.google.com/search" method="GET">
        <select id="engine-selector" class="engine-selector" title="Selecionar Motor de Busca">
          <option value="google">Google</option>
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="bing">Bing</option>
          <option value="youtube">YouTube</option>
          <option value="github">GitHub</option>
          <option value="chatgpt">ChatGPT</option>
          <option value="perplexity">Perplexity</option>
        </select>
        <input type="text" id="search-input" name="q" placeholder="Pesquisar no Google ou digitar URL..." autofocus autocomplete="off">
      </form>
    </section>

    <!-- View 1: Shortcuts Grid View -->
    <div id="shortcuts-view" class="view-panel active">
      <div class="shortcuts-container">
        <!-- Tag Filter Pills Bar -->
        <div id="tag-filters-bar" class="tag-filters-bar">
          <!-- Tag pills dynamically rendered by shortcuts.js -->
        </div>

        <!-- Shortcuts Grid -->
        <div id="shortcuts-grid" class="shortcuts-grid">
          <!-- Shortcut Cards rendered dynamically -->
        </div>
      </div>
    </div>

    <!-- View 2: Bookmarks View with View Switcher (Explorer vs Ribbon) -->
    <div id="bookmarks-view" class="view-panel">
      <!-- Bookmarks View Control Header -->
      <div class="bookmarks-mode-bar">
        <div class="mode-switcher-group">
          <button id="mode-explorer-btn" class="mode-btn active" title="Modo Explorer (2 Colunas)">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:3px;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            Explorer
          </button>
          <button id="mode-ribbon-btn" class="mode-btn" title="Modo Barra Horizontal (Navegador)">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:3px;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            Barra de Favoritos
          </button>
        </div>

        <div style="display:flex; align-items:center; gap:0.5rem;">
          <span id="save-indicator" class="save-indicator">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Alterações Salvas
          </span>
        </div>
      </div>

      <!-- Mode 1: Horizontal Bookmark Ribbon (Style Browser Bar) -->
      <div id="bookmarks-ribbon-container" class="bookmarks-ribbon-container hidden">
        <div id="bookmark-ribbon-list" class="ribbon-list">
          <!-- Rendered dynamically by bookmarks.js -->
        </div>
      </div>

      <!-- Mode 2: Dual-Panel Bookmarks Explorer View -->
      <div id="bookmarks-explorer-container" class="bookmarks-explorer">
        <!-- Left Sidebar: Folder Directory -->
        <aside id="bookmarks-sidebar" class="bookmarks-sidebar">
          <div class="sidebar-header-row">
            <span class="sidebar-title">Pastas</span>
            <button id="collapse-all-folders-btn" class="btn-text-xs" title="Recolher Todas as Pastas">
              Recolher Tudo
            </button>
          </div>
          <div id="folder-tree-list" class="folder-list">
            <!-- Folders rendered by bookmarks.js -->
          </div>
        </aside>

        <!-- Right Main Panel: Toolbar & Bookmarks Grid -->
        <main class="bookmarks-main-panel">
          <div class="bookmarks-top-bar">
            <div id="breadcrumbs" class="breadcrumbs">
              <span>Favoritos</span>
            </div>

            <div class="bookmarks-search-box">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="bookmarks-search-input" placeholder="Filtrar nesta pasta...">
            </div>
          </div>

          <!-- Bulk Actions Toolbar -->
          <div class="bulk-toolbar">
            <label class="select-all-wrapper">
              <input type="checkbox" id="select-all-bookmarks">
              <span>Selecionar Todos</span>
            </label>

            <div class="bulk-btn-group">
              <button id="bulk-open-btn" class="bulk-btn" disabled title="Abrir Selecionados em Abas">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                Abrir Abas (<span id="bulk-count">0</span>)
              </button>
              <button id="bulk-move-btn" class="bulk-btn" disabled title="Mover Selecionados">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                Mover
              </button>
              <button id="bulk-delete-btn" class="bulk-btn danger" disabled title="Excluir Selecionados">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Excluir
              </button>
              <button id="new-bookmark-btn" class="bulk-btn" style="margin-left: 0.5rem; background: var(--accent-color); color: #fff; border:none;">
                + Novo Favorito
              </button>
            </div>
          </div>

          <!-- Bookmark Items Content Grid -->
          <div id="bookmarks-content-grid" class="bookmarks-content-grid">
            <!-- Bookmark Cards rendered dynamically -->
          </div>
        </main>
      </div>
    </div>

    <!-- View 3: Automations & Scratchpad View -->
    <div id="automations-view" class="view-panel">
      <div class="automations-container">
        <!-- Scheduled Alarms Card -->
        <div class="panel-card">
          <div class="panel-card-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Agendador de Guias
          </div>
          
          <form id="automation-form" style="display:flex; flex-direction:column; gap:0.6rem;">
            <input type="url" id="auto-url" placeholder="https://plataforma.felipecabrera.dev/app" required style="padding:0.6rem; background:var(--bg-surface); border:1px solid var(--card-border); color:var(--text-primary); border-radius:6px;">
            <div style="display:flex; gap:0.5rem;">
              <input type="time" id="auto-time" required style="padding:0.6rem; background:var(--bg-surface); border:1px solid var(--card-border); color:var(--text-primary); border-radius:6px; flex:1;">
              <button type="submit" class="btn btn-primary" style="padding:0.6rem 1rem;">Agendar</button>
            </div>
          </form>

          <div id="alarms-list" class="alarms-list">
            <!-- Active Alarms -->
          </div>
        </div>

        <!-- Scratchpad Quick Notes Card -->
        <div class="panel-card">
          <div class="panel-card-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Bloco de Notas Rápido
          </div>
          <textarea id="scratchpad" class="scratchpad-textarea" placeholder="Digite anotações rápidas ou lembretes aqui... Salvo automaticamente."></textarea>
          <div id="notes-status" class="notes-status">Salvo automaticamente</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Expanded & Compact Multi-Tabbed Settings Modal -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-header-title">Configurações Gerais</h3>
        <button id="close-settings-btn" class="icon-btn">&times;</button>
      </div>

      <div class="modal-nav-tabs">
        <button class="modal-tab-btn active" data-tab="tab-shortcut">Atalho</button>
        <button class="modal-tab-btn" data-tab="tab-appearance">Aparência & Temas</button>
        <button class="modal-tab-btn" data-tab="tab-backup">Dados & Backup</button>
      </div>

      <div class="modal-body">
        <!-- Tab 1: Shortcut Edit / Create (2-Column Grid Layout) -->
        <div id="tab-shortcut" class="modal-tab-content active">
          <form id="shortcut-form">
            <input type="hidden" id="shortcut-id">

            <div class="form-row-grid">
              <div class="form-group">
                <label for="shortcut-name">Nome do Atalho</label>
                <input type="text" id="shortcut-name" placeholder="Ex: GitHub, YouTube, Resume.AI" required>
              </div>
              <div class="form-group">
                <label for="shortcut-url">URL / Endereço Web</label>
                <input type="url" id="shortcut-url" placeholder="https://github.com" required>
              </div>
            </div>

            <div class="form-row-grid">
              <div class="form-group">
                <label for="shortcut-tags">Tags (separadas por vírgula)</label>
                <input type="text" id="shortcut-tags" placeholder="Ex: Dev, IA, Mídia, Estudo">
              </div>
              <div class="form-group">
                <label for="shortcut-custom-icon-url">Ícone (URL da Imagem)</label>
                <input type="url" id="shortcut-custom-icon-url" placeholder="https://exemplo.com/logo.png">
              </div>
            </div>

            <div class="form-group">
              <label for="shortcut-custom-icon-file">Ou Carregar Imagem Local</label>
              <input type="file" id="shortcut-custom-icon-file" accept="image/*" style="font-size:0.82rem; color:var(--text-secondary); padding:0.4rem 0.6rem;">
              <div id="icon-preview-wrapper" style="display:none; align-items:center; gap:0.5rem; margin-top:0.3rem;">
                <span style="font-size:0.75rem; color:var(--text-muted);">Preview:</span>
                <img id="icon-preview-img" src="" style="width:26px; height:26px; object-fit:contain; border-radius:4px;">
                <button type="button" id="clear-custom-icon" class="btn-text" style="color:var(--danger-color); font-size:0.75rem;">Remover Ícone</button>
              </div>
            </div>

            <div class="modal-footer" style="padding: 0.75rem 0 0 0; border:none;">
              <button type="button" id="cancel-shortcut-btn" class="btn btn-secondary">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar Atalho</button>
            </div>
          </form>
        </div>

        <!-- Tab 2: Appearance & Themes -->
        <div id="tab-appearance" class="modal-tab-content">
          <div class="form-group">
            <label>Selecione o Tema Visual</label>
            <div class="theme-options-grid">
              <div class="theme-card active" data-theme="zinc">
                <div class="theme-swatch" style="background:#18181b;"></div>
                Zinc Dark
              </div>
              <div class="theme-card" data-theme="amoled">
                <div class="theme-swatch" style="background:#000000; border:1px solid #333;"></div>
                AMOLED Black
              </div>
              <div class="theme-card" data-theme="midnight">
                <div class="theme-swatch" style="background:#0b0f19;"></div>
                Midnight Blue
              </div>
              <div class="theme-card" data-theme="emerald">
                <div class="theme-swatch" style="background:#061412;"></div>
                Cyber Emerald
              </div>
            </div>
          </div>
        </div>

        <!-- Tab 3: Backup & Data -->
        <div id="tab-backup" class="modal-tab-content">
          <div class="form-group">
            <label>Exportar ou Importar Configurações</label>
            <p style="font-size:0.8rem; color:var(--text-muted);">Faça backup dos seus atalhos e preferências em um arquivo .json.</p>
            <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
              <button id="export-json-btn" class="btn btn-secondary">Exportar JSON</button>
              <label class="btn btn-secondary" style="cursor:pointer; display:inline-block;">
                Importar JSON
                <input type="file" id="import-json-file" accept=".json" style="display:none;">
              </label>
            </div>
          </div>
          <div class="form-group" style="margin-top:1rem;">
            <label>Restaurar Padrões</label>
            <button id="reset-all-btn" class="btn btn-danger">Restaurar Atalhos Originais</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/clock.js"></script>
  <script src="js/search.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/automations.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
